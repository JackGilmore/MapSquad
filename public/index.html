<!doctype html>
<html lang="en" data-bs-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>MapSquad</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
		<style>
			html, body { height: 100%; }
			#map { height: calc(100vh - 190px); }
			.question-item { cursor: pointer; }
			#addrOverlay { z-index: 1100; pointer-events: auto; }
			#addrSuggest { z-index: 1200; }
		</style>
	</head>
	<body>
			<nav class="navbar navbar-expand-lg bg-body-tertiary">
				<div class="container-fluid">
					<a class="navbar-brand" href="#">MapSquad</a>
				</div>
			</nav>

		<div class="container py-3">
					<div id="landing" class="row g-3">
						<div class="col-12 col-lg-6">
							<div class="card">
								<div class="card-header">Create a room</div>
								<div class="card-body">
									<div class="mb-2">
										<label class="form-label" for="nameInput">Your name</label>
										<input id="nameInput" class="form-control" placeholder="Your name" />
									</div>
									<button id="createBtn" class="btn btn-primary">Create Room</button>
									<div id="createResult" class="mt-3 d-none">
										<p class="mb-1">Room code: <strong id="roomCode"></strong></p>
										<div id="qr" class="border rounded p-2 d-inline-block"></div>
										<p class="mt-2 small text-muted">Participants can scan the QR to join.</p>
									</div>
								</div>
							</div>
						</div>
						<div class="col-12 col-lg-6">
							<div class="card">
								<div class="card-header">Join a room</div>
								<div class="card-body">
									<div class="mb-2">
										<label class="form-label" for="joinName">Your name</label>
										<input id="joinName" class="form-control" placeholder="Your name" />
									</div>
									<div class="mb-2">
										<label class="form-label" for="roomInput">Room code</label>
										<input id="roomInput" class="form-control" placeholder="ABC123" />
									</div>
									<button id="joinBtn" class="btn btn-outline-primary">Join Room</button>
								</div>
							</div>
						</div>
					</div>

							<div id="app" class="row g-3 d-none">
						<div class="col-12 col-lg-4">
								<div class="card">
									<div class="card-header d-flex justify-content-between align-items-center">
										<span id="qHeader">Questions</span>
										<button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#qBody" aria-expanded="true" aria-controls="qBody">−</button>
									</div>
									<div id="qBody" class="card-body collapse show">
									<form id="askForm" class="d-flex gap-2 mb-2">
								<input id="qInput" class="form-control" placeholder="Ask a question..." />
								<button class="btn btn-success" type="submit">Ask</button>
							</form>
							<ul id="qList" class="list-group"></ul>
						</div>
					</div>
								<div class="card mt-3">
									<div class="card-header d-flex justify-content-between align-items-center">
										<span>Presence</span>
										<button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#presenceBody" aria-expanded="true" aria-controls="presenceBody">−</button>
									</div>
									<div id="presenceBody" class="collapse show">
										<ul id="presence" class="list-group list-group-flush"></ul>
									</div>
					</div>
								<div id="inviteCard" class="card mt-3 d-none">
									<div class="card-header d-flex justify-content-between align-items-center">
										<span>Invite participants</span>
										<button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#inviteBody" aria-expanded="true" aria-controls="inviteBody">−</button>
									</div>
									<div id="inviteBody" class="card-body collapse show">
											<p class="mb-1">Room code: <strong id="inviteRoomCode"></strong></p>
											<div id="inviteQr" class="border rounded p-2 d-inline-block"></div>
											<div class="mt-2">
												<button id="copyInvite" class="btn btn-sm btn-outline-secondary">Copy invite link</button>
											</div>
										</div>
										<!-- close invite card -->
									</div>
										<!-- Points card -->
										<div id="pinsCard" class="card mt-3 d-none">
											<div class="card-header d-flex justify-content-between align-items-center">
												<span>Points</span>
												<div class="d-flex gap-2">
													<button id="exportPins" class="btn btn-sm btn-outline-secondary" type="button">Export CSV</button>
													<button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#pinsBody" aria-expanded="true" aria-controls="pinsBody">−</button>
												</div>
											</div>
											<div id="pinsBody" class="card-body collapse show p-0">
												<div class="table-responsive">
													<table class="table table-sm table-striped mb-0">
														<thead>
															<tr>
																<th scope="col" role="button" data-sort="question">Question</th>
																<th scope="col" role="button" data-sort="author">By</th>
																<th scope="col" role="button" data-sort="label">Label</th>
															</tr>
														</thead>
														<tbody id="pinsTbody"></tbody>
													</table>
												</div>
											</div>
										</div>
								</div>
							<div class="col-12 col-lg-8">
								<div class="d-flex justify-content-between align-items-center mb-2">
									<div class="form-text">Click the map to drop an answer pin for the selected question.</div>
									<button id="clearPins" class="btn btn-sm btn-outline-danger d-none" type="button">Clear Pins</button>
								</div>
								<div id="map" class="rounded border position-relative">
									<div id="addrOverlay" class="position-absolute top-0 start-50 translate-middle-x p-2" style="z-index: 1100; pointer-events: none;">
										<div id="addrBox" class="bg-white rounded shadow p-2" style="max-width: 600px; width: 100%; pointer-events: auto;">
											<div class="input-group input-group-sm">
												<input id="addrInput" class="form-control" placeholder="Search address (e.g. Dundee, DD1)" autocomplete="off" />
												<button id="addrSubmit" class="btn btn-outline-secondary" type="button">Add</button>
											</div>
											<div id="addrSuggest" class="list-group mt-1 d-none" style="max-height: 220px; overflow: auto;"></div>
										</div>
									</div>
								</div>
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
		<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
		<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
		<script>
			// Basic state
			let ws;
			let currentRoom = null;
			let creatorToken = null;
			let isCreator = false;
			let yourName = localStorage.getItem('mapsquad:name') || '';
			let selectedQuestionId = null;

			const nameInput = document.getElementById('nameInput');
			const joinNameInput = document.getElementById('joinName');
			const roomInput = document.getElementById('roomInput');
			nameInput.value = yourName;
			joinNameInput.value = yourName;

					// Leaflet (lazy init once app is visible)
					let map = null;
					const markers = {};
					const questionSet = new Set();
					const questionMap = new Map(); // id -> text
					let pinsList = [];
					let sortField = 'author';
					let sortDir = 'asc'; // 'asc' | 'desc'
					function ensureMap() {
						if (map) return map;
						map = L.map('map');
						L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
							maxZoom: 19,
							attribution: '&copy; OpenStreetMap contributors'
						}).addTo(map);
						// Center on Dundee (demo)
						map.setView([56.4620, -2.9707], 13);
							// Hook address overlay inside map
							// Re-query overlay each time to ensure it's present
							const overlay = document.getElementById('addrOverlay');
							if (overlay) {
								// Prevent map drag/scroll when interacting with overlay
								const box = document.getElementById('addrBox');
								if (box && window.L && L.DomEvent) {
									try {
										L.DomEvent.disableClickPropagation(box);
										L.DomEvent.disableScrollPropagation(box);
									} catch {}
								}
								overlay.addEventListener('mouseenter', () => { map.scrollWheelZoom.disable(); map.dragging.disable(); });
								overlay.addEventListener('mouseleave', () => { map.scrollWheelZoom.enable(); map.dragging.enable(); });
								const input = document.getElementById('addrInput');
								const list = document.getElementById('addrSuggest');
								const submitBtn = document.getElementById('addrSubmit');
								if (input && list) {
									let items = [];
									let activeIndex = -1;
									let controller = null;
									function clearList() {
										list.innerHTML = '';
										list.classList.add('d-none');
										items = [];
										activeIndex = -1;
									}
									function setActive() {
										items.forEach((el, idx) => el.classList.toggle('active', idx === activeIndex));
										if (items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
									}
									async function fetchSuggestions(q) {
										if (controller) controller.abort();
										controller = new AbortController();
										// Bias to Dundee area via viewbox + bounded
										const viewbox = '-3.10,56.55,-2.75,56.39';
										const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&viewbox=${viewbox}&bounded=1&q=${encodeURIComponent(q)}`;
										const resp = await fetch(url, { signal: controller.signal, headers: { 'Accept': 'application/json' } });
										if (!resp.ok) return [];
										return resp.json();
									}
									async function choose(r) {
										clearList();
										if (!ws || !currentRoom || !selectedQuestionId) { alert('Select a question first.'); return; }
										const lat = parseFloat(r.lat), lng = parseFloat(r.lon);
										if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
										map.flyTo([lat, lng], 15);
										ws.send(JSON.stringify({ type: 'answer-pin', questionId: selectedQuestionId, lat, lng, label: r.display_name }));
									}
									let debounceTimer = null;
									input.addEventListener('input', () => {
										const q = input.value.trim();
										if (!q) { clearList(); return; }
										clearTimeout(debounceTimer);
										debounceTimer = setTimeout(async () => {
											try {
												const res = await fetchSuggestions(q);
												list.innerHTML = '';
												(res || []).forEach((r) => {
													const a = document.createElement('a');
													a.href = '#';
													a.className = 'list-group-item list-group-item-action';
													a.textContent = r.display_name;
													a.addEventListener('mousedown', (ev) => { ev.preventDefault(); ev.stopPropagation(); });
													a.addEventListener('click', (ev) => { ev.preventDefault(); ev.stopPropagation(); choose(r); });
													list.appendChild(a);
												});
												items = Array.from(list.children);
												list.classList.toggle('d-none', items.length === 0);
												activeIndex = -1;
											} catch {}
										}, 250);
									});
									// Stop events on overlay elements from bubbling to map
									['click','mousedown','dblclick','pointerdown','touchstart'].forEach(evt => {
										input.addEventListener(evt, (e) => { e.stopPropagation(); });
										list.addEventListener(evt, (e) => { e.stopPropagation(); });
										if (box) box.addEventListener(evt, (e) => { e.stopPropagation(); });
									});
									input.addEventListener('keydown', (e) => {
										if (list.classList.contains('d-none')) return;
										if (e.key === 'ArrowDown') { e.preventDefault(); activeIndex = Math.min(activeIndex + 1, items.length - 1); setActive(); }
										else if (e.key === 'ArrowUp') { e.preventDefault(); activeIndex = Math.max(activeIndex - 1, 0); setActive(); }
										else if (e.key === 'Enter') { if (activeIndex >= 0 && items[activeIndex]) { e.preventDefault(); items[activeIndex].click(); } }
									});
									if (submitBtn) {
										submitBtn.addEventListener('click', async () => {
											const q = input.value.trim();
											if (!q) return;
											const res = await fetchSuggestions(q);
											if (res && res.length > 0) choose(res[0]);
										});
									}
								}
							}

							// Current location control
						const LocateControl = L.Control.extend({
							onAdd: function() {
								const btn = L.DomUtil.create('button', 'btn btn-light btn-sm');
								btn.type = 'button';
								btn.title = 'Go to my location';
								btn.textContent = '📍';
								L.DomEvent.on(btn, 'click', (e) => {
									L.DomEvent.stopPropagation(e);
									if (!navigator.geolocation) {
										alert('Geolocation not supported');
										return;
									}
									navigator.geolocation.getCurrentPosition((pos) => {
										const { latitude, longitude } = pos.coords;
										map.flyTo([latitude, longitude], 13);
									}, (err) => {
										alert('Unable to get location');
									}, { enableHighAccuracy: true, timeout: 8000 });
								});
								const container = L.DomUtil.create('div', 'leaflet-bar');
								container.appendChild(btn);
								return container;
							},
							onRemove: function() {}
						});
						(new LocateControl({ position: 'topleft' })).addTo(map);
						// Map click to send pin
						map.on('click', (e) => {
							if (!ws || !currentRoom || !selectedQuestionId) return;
							const { lat, lng } = e.latlng;
							const label = prompt('Optional label for this pin?') || undefined;
							ws.send(JSON.stringify({ type: 'answer-pin', questionId: selectedQuestionId, lat, lng, label }));
						});
						// Ensure proper layout after becoming visible
						setTimeout(() => map.invalidateSize(), 50);
						return map;
					}

					function connect(room, opts = {}) {
				if (ws) try { ws.close(); } catch {}
						const name = (opts.name || joinNameInput.value || nameInput.value || '').trim() || `anon-${crypto.randomUUID().slice(0,4)}`;
				localStorage.setItem('mapsquad:name', name);
						currentRoom = room;
				const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
						const tokenParam = opts.token ? `&token=${encodeURIComponent(opts.token)}` : '';
						ws = new WebSocket(`${protocol}://${location.host}/room/${encodeURIComponent(room)}?name=${encodeURIComponent(name)}${tokenParam}`);

				ws.addEventListener('open', () => {
					// request presence
					ws.send(JSON.stringify({ type: 'list' }));
				});
				ws.addEventListener('message', (ev) => {
					const data = JSON.parse(ev.data);
										if (data.type === 'joined') {
											isCreator = !!data.isCreator;
											// Toggle UI
											document.getElementById('landing').classList.add('d-none');
											document.getElementById('app').classList.remove('d-none');
											document.getElementById('askForm').classList.toggle('d-none', !isCreator);
											document.getElementById('clearPins').classList.toggle('d-none', !isCreator);
											document.getElementById('qHeader').innerText = `Questions (Room ${data.room})`;
											// Show invite card for creator, with persistent QR
											const invite = document.getElementById('inviteCard');
											invite.classList.toggle('d-none', !isCreator);
											if (isCreator) {
												const codeEl = document.getElementById('inviteRoomCode');
												codeEl.textContent = data.room;
												const url = `${location.origin}/?room=${encodeURIComponent(data.room)}`;
												const qrEl = document.getElementById('inviteQr');
												qrEl.innerHTML = '';
												QRCode.toCanvas(url, { width: 192 }, (err, canvas) => { if (!err) qrEl.appendChild(canvas); });
												const copyBtn = document.getElementById('copyInvite');
												copyBtn.onclick = async () => {
													try { await navigator.clipboard.writeText(url); copyBtn.textContent = 'Copied!'; setTimeout(() => copyBtn.textContent = 'Copy invite link', 1500); } catch {}
												};
											}
											// Ensure map is ready and sized
											ensureMap();
														// Show pins card for everyone once joined
														document.getElementById('pinsCard').classList.remove('d-none');
								} else if (data.type === 'presence') {
						renderPresence(data.members);
								} else if (data.type === 'question') {
						addQuestion(data);
											} else if (data.type === 'answer-pin') {
												addPin(data);
								} else if (data.type === 'state') {
									// Render initial state
									ensureMap();
												data.questions.forEach(q => addQuestion(q));
												// Reset and rebuild from state
												clearAllPins();
												pinsList = [];
												data.pins.forEach(p => addPin(p));
												renderPinsTable();
								} else if (data.type === 'pins-cleared') {
												clearAllPins();
												pinsList = [];
												renderPinsTable();
					} else if (data.type === 'error') {
						alert(data.message);
					}
				});
			}

			function renderPresence(members) {
				const ul = document.getElementById('presence');
				ul.innerHTML = '';
				members.forEach(m => {
					const li = document.createElement('li');
					li.className = 'list-group-item';
					li.textContent = m;
					ul.appendChild(li);
				});
			}

			const qList = document.getElementById('qList');
							function addQuestion(q) {
						if (questionSet.has(q.id)) return;
						questionSet.add(q.id);
								questionMap.set(q.id, q.text);
				const li = document.createElement('li');
				li.className = 'list-group-item d-flex justify-content-between align-items-center question-item';
				li.dataset.qid = q.id;
				li.innerHTML = `<span>${q.text} <small class="text-muted">— ${q.author}</small></span>`;
				li.addEventListener('click', () => {
					selectedQuestionId = q.id;
					Array.from(qList.children).forEach(ch => ch.classList.remove('active'));
					li.classList.add('active');
				});
				qList.prepend(li);
				// Auto-select newest
				selectedQuestionId = q.id;
				Array.from(qList.children).forEach(ch => ch.classList.remove('active'));
				li.classList.add('active');
			}

							function addPin(p) {
				const key = `${p.questionId}:${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
								if (markers[key]) return; // de-dupe simple
				const marker = L.marker([p.lat, p.lng]).addTo(map);
								const qText = questionMap.get(p.questionId) || p.questionId;
								marker.bindPopup(`<strong>Question</strong>: ${qText}<br><strong>By:</strong> ${p.author}<br>${p.label || ''}`);
				markers[key] = marker;
								// push into list if not present by same key
								const exists = pinsList.find((x) => x._key === key);
								if (!exists) {
									pinsList.push({ ...p, _key: key, question: qText });
									renderPinsTable();
								}
			}

							function clearAllPins() {
								Object.values(markers).forEach(m => map.removeLayer(m));
								for (const k of Object.keys(markers)) delete markers[k];
							}

									function renderPinsTable() {
										const tbody = document.getElementById('pinsTbody');
										tbody.innerHTML = '';
										// Sort copy of array
										const rows = [...pinsList].sort((a, b) => {
											let va, vb;
											switch (sortField) {
												case 'question': va = a.question || ''; vb = b.question || ''; break;
												case 'label': va = a.label || ''; vb = b.label || ''; break;
												case 'author': va = a.author || ''; vb = b.author || ''; break;
												default: va = a.author || ''; vb = b.author || ''; break;
											}
											if (va < vb) return sortDir === 'asc' ? -1 : 1;
											if (va > vb) return sortDir === 'asc' ? 1 : -1;
											return 0;
										});
												rows.forEach(p => {
											const tr = document.createElement('tr');
											tr.dataset.key = p._key;
													tr.style.cursor = 'pointer';
													tr.addEventListener('click', () => {
														ensureMap();
														map.flyTo([p.lat, p.lng], 14);
													});
											const cells = [
												p.question || p.questionId,
												p.author,
												p.label || ''
											];
											cells.forEach((val) => {
												const td = document.createElement('td');
												td.textContent = val;
												tr.appendChild(td);
											});
											tbody.appendChild(tr);
										});
									}

											// Sorting handlers
											document.addEventListener('click', (e) => {
												const th = e.target.closest('th[data-sort]');
												if (!th) return;
												const field = th.getAttribute('data-sort');
												if (!field) return;
												if (sortField === field) {
													sortDir = sortDir === 'asc' ? 'desc' : 'asc';
												} else {
													sortField = field;
													sortDir = 'asc';
												}
												renderPinsTable();
											});

											// CSV export
											document.getElementById('exportPins').addEventListener('click', () => {
												const headers = ['Question','By','Label'];
												const lines = [headers.join(',')];
												const fmt = (s) => '"' + String(s ?? '').replace(/"/g, '""') + '"';
												const rows = [...pinsList];
												rows.forEach(p => {
													lines.push([fmt(p.question || p.questionId), fmt(p.author || ''), fmt(p.label || '')].join(','));
												});
												const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
												const url = URL.createObjectURL(blob);
												const a = document.createElement('a');
												a.href = url;
												a.download = `mapsquad-pins-${Date.now()}.csv`;
												document.body.appendChild(a);
												a.click();
												a.remove();
												URL.revokeObjectURL(url);
											});

					document.getElementById('createBtn').addEventListener('click', async () => {
						const name = (nameInput.value || '').trim();
						if (!name) return alert('Enter your name');
						const resp = await fetch('/api/rooms', { method: 'POST' });
						if (!resp.ok) return alert('Failed to create room');
						const { room, token } = await resp.json();
						creatorToken = token;
						document.getElementById('createResult').classList.remove('d-none');
						document.getElementById('roomCode').textContent = room;
						const joinUrl = `${location.origin}/?room=${encodeURIComponent(room)}`;
						const qrEl = document.getElementById('qr');
						qrEl.innerHTML = '';
						QRCode.toCanvas(joinUrl, { width: 192 }, (err, canvas) => {
							if (!err) qrEl.appendChild(canvas);
						});

						// Auto-connect as creator
						connect(room, { name, token });
					});
					document.getElementById('joinBtn').addEventListener('click', () => {
						const name = (joinNameInput.value || '').trim();
						if (!name) return alert('Enter your name');
						const code = (roomInput.value || '').trim();
						if (!code) return alert('Enter room code');
						connect(code, { name });
					});

					document.getElementById('askForm').addEventListener('submit', (e) => {
				e.preventDefault();
						if (!ws || !currentRoom || !isCreator) return alert('Only the room creator can ask questions.');
				const input = document.getElementById('qInput');
				const text = input.value.trim();
				if (!text) return;
				const id = crypto.randomUUID();
				ws.send(JSON.stringify({ type: 'question', id, text }));
				input.value = '';
			});

							document.getElementById('clearPins').addEventListener('click', () => {
								if (!ws || !currentRoom || !isCreator) return;
								if (confirm('Clear all pins for this room?')) {
									ws.send(JSON.stringify({ type: 'clear-pins' }));
								}
							});

							// Auto-join via URL param: prompt for name then connect
							const params = new URLSearchParams(location.search);
							const r = params.get('room');
							if (r) {
								roomInput.value = r;
								let name = localStorage.getItem('mapsquad:name') || '';
								if (!name) {
									name = prompt('Enter your name to join the room:') || '';
								}
								if (name) {
									nameInput.value = name;
									joinNameInput.value = name;
									connect(r, { name });
								} else {
									// keep landing visible but pre-fill code
									document.getElementById('landing').classList.remove('d-none');
								}
							}
		</script>
	</body>
	</html>
